# sdk-config.yaml is a typical starting point for configuring our custom distribution, including exporting to
# localhost via OTLP.

# NOTE: With the exception of env var substitution syntax (i.e. ${MY_ENV}), SDKs ignore
# environment variables when interpreting config files. This including ignoring all env
# vars defined in https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/.

# The file format version.
file_format: "1.1"

# Configure if the SDK is disabled or not. This setting is optional, the default value when not provided is for the SDK to be enabled
disabled: false

# Configure resource for all signals.
resource:
  # Configure resource attributes. Entries have higher priority than entries from .resource.attributes_list.
  # Entries must contain .name nand .value, and may optionally include .type, which defaults ot "string" if not set. The value must match the type. Values for .type include: string, bool, int, double, string_array, bool_array, int_array, double_array.
  attributes:
    - name: service.name
      value: swi-test-app
  # Configure resource detectors. SolarWinds detectors are listed first so upstream detectors can override their attributes.
  detection/development:
    detectors:
      - swo_apm:
      - swo_uams:
      - swo_k8s:

# Provide shared config for multi-language deployment
distribution:
  solarwinds:
    agent.serviceKey: ""
    agent.collector: ""
    agent.logging:
      level: info

# Configure general attribute limits. See also tracer_provider.limits, logger_provider.limits.
attribute_limits:

# Configure text map context propagators.
propagator:
  # Configure the set of propagators to include in the composite text map propagator.
  composite:
    - tracecontext:
    - baggage:
    - swo_tracestate:
    - swo_xtraceoptions:

# Configure tracer provider.
tracer_provider:
  processors:
    - swo_stacktrace:
    - swo_response_time:
    - swo_profiler:
        enabled: false
        interval: 20
        exclude_packages:
          - java
          - javax
          - com.sun
          - sun
          - sunw

# Configure meter provider.
meter_provider:
  readers:

# Configure logger provider. Remove to disable log export
logger_provider:
  processors:

instrumentation/development:
  java:
    runtime_telemetry:
      emit_experimental_jfr_metrics/development: true
    common:
      default-enabled: true